/**:
  ros__parameters:
    use_sim_time: true

    robot1_namespace: robot1
    robot2_namespace: robot2

    # World/map-frame goal poses [x, y, yaw_rad]
    r1_start: [-3.00, -1.60, 0.00]
    r1_dock: [-0.85, 0.00, 0.00]
    r1_clear: [-2.30, 1.45, 0.00]

    r2_start: [3.00, -1.60, 3.14159]
    r2_dock: [0.85, 0.00, 3.14159]
    r2_destination: [3.10, 1.55, 0.00]

    manipulator_base: [0.00, 0.00, 0.00]
    robot1_transfer_point: [-0.38, 0.00]
    robot2_transfer_point: [0.38, 0.00]

    # Coordinator policy
    command_timeout_sec: 45.0
    max_retries: 1
